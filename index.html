<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/mediaquery.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <title>Tela de Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
            </div>
            <div id="form">
                <h1>Login</h1>
                <p>Seja Bem-vindo novamente. Faça login para acessar sua conta e poder fazer configurações no seu ambiente</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-icons md-dark">person</span>
                        <input type="email" name="email" id="email" placeholder="Seu@email" required minlength="6" autocomplete="email">
                        <label for="email">Login</label>
                    </div>
                    <div class="campo">
                        <span class="material-icons md-dark">vpn_key</span>
                        <input type="password" name="senha" id="senha" placeholder="Sua senha" required autocomplete="current-password" minlength="6">
                        <label for="senha">Senha</label>
                    </div>
                    <input type="submit" value="Enviar">
                    <a href="esqueci.html" id="botao">Esqueci a Senha<span class="material-icons md-dark">mail</span></a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
